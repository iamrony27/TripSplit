<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#006C4C"/>
      <stop offset="50%" stop-color="#005239"/>
      <stop offset="100%" stop-color="#003826"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#88F9C6"/>
      <stop offset="100%" stop-color="#47D19B"/>
    </linearGradient>
    <linearGradient id="softMint" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8FDF3"/>
      <stop offset="100%" stop-color="#B6F3D6"/>
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#002116" flood-opacity="0.35"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#88F9C6" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- App Icon Squircle Background (Material You style rounded surface) -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>

  <!-- Subtle Ambient Glow Rings -->
  <circle cx="256" cy="230" r="170" fill="none" stroke="#88F9C6" stroke-opacity="0.08" stroke-width="40"/>
  <circle cx="256" cy="230" r="140" fill="none" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="2"/>

  <!-- Main Symbol Group: Intersection of Travel Compass Pin & Dynamic Split Arrows -->
  <g filter="url(#dropShadow)" transform="translate(0, -10)">

    <!-- Outer Circular Flow / Split Ribbon Left (Upward & Outward Settle) -->
    <path d="M 230 130 C 175 136, 134 182, 134 238 C 134 278, 156 313, 190 332 L 206 304 C 182 290, 166 266, 166 238 C 166 199, 194 167, 232 162 Z" fill="url(#softMint)"/>

    <!-- Left Split Arrowhead -->
    <path d="M 224 116 L 254 146 L 210 162 Z" fill="url(#accentGrad)" filter="url(#glow)"/>

    <!-- Outer Circular Flow / Split Ribbon Right (Downward & Settling Return) -->
    <path d="M 282 346 C 337 340, 378 294, 378 238 C 378 198, 356 163, 322 144 L 306 172 C 330 186, 346 210, 346 238 C 346 277, 318 309, 280 314 Z" fill="url(#accentGrad)"/>

    <!-- Right Split Arrowhead -->
    <path d="M 288 360 L 258 330 L 302 314 Z" fill="url(#softMint)"/>

    <!-- Central Diamond / Compass Location Pivot symbolizing Shared Destination -->
    <g transform="translate(256, 238)">
      <!-- Diamond base -->
      <polygon points="0,-48 48,0 0,48 -48,0" fill="#FFFFFF" opacity="0.96"/>
      <!-- Inner Dynamic Split / Rupee Symbol Cut Motif -->
      <polygon points="0,-28 28,0 0,28 -28,0" fill="#006C4C"/>
      <!-- Micro Central Dot -->
      <circle cx="0" cy="0" r="6" fill="#88F9C6"/>
    </g>

    <!-- Floating Currency & Settlement Dots -->
    <circle cx="200" cy="180" r="7" fill="#88F9C6" opacity="0.9"/>
    <circle cx="312" cy="296" r="7" fill="#FFFFFF" opacity="0.9"/>
  </g>

  <!-- Wordmark "TripSplit" at the bottom -->
  <text x="256" y="440" text-anchor="middle" font-family="'Roboto Flex', 'Inter', system-ui, sans-serif" font-size="34" font-weight="700" letter-spacing="2" fill="#FFFFFF">
    TRIP<tspan fill="#88F9C6">SPLIT</tspan>
  </text>
  <text x="256" y="468" text-anchor="middle" font-family="'Roboto Flex', 'Inter', system-ui, sans-serif" font-size="13" font-weight="500" letter-spacing="4" fill="#A8DEC2" opacity="0.8">
    GROUP EXPENSE MANAGER
  </text>
</svg>
